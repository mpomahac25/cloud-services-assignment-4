name: Deploy Currency Service

on:
  push:
    branches:
      - main
    paths:
      - "currency-service/VERSION"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read version
        run: echo "VERSION=$(cat currency-service/VERSION)" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check version does not already exist
        run: |
          if docker manifest inspect ${{ vars.DOCKERHUB_USERNAME }}/cloud-assignment-w5-currency-sevice:${{ env.VERSION }} > /dev/null 2>&1; then
            echo "Version $VERSION already exists in Docker Hub."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push currency service
        uses: docker/build-push-action@v7
        with:
          context: ./currency-service
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/cloud-assignment-w5-currency-service:${{ env.VERSION }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v2
        with:
          oc: "4"

      - name: Login to Rahti
        run: >
          oc login
          ${{ vars.RAHTI_SERVER }}
          --token=${{ secrets.RAHTI_TOKEN }}

      - name: Select Rahti project
        run: oc project ${{ vars.RAHTI_NAMESPACE }}

      - name: Deploy currency service
        run: >
          oc set image deployment/currency-service
          currency-service=docker.io/${{ vars.DOCKERHUB_USERNAME }}/cloud-assignment-w5-currency-service:${{ env.VERSION }}

      - name: Wait for rollout
        run: oc rollout status deployment/currency-service --timeout=180s
