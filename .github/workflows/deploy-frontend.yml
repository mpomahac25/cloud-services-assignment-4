name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/VERSION"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read version
        run: echo "VERSION=$(cat frontend/VERSION)" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/cloud-assignment-w4-frontend:${{ env.VERSION }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v2
        with:
          oc: "4"

      - name: Login to Rahti
        run: >
          oc login
          ${{ secrets.RAHTI_SERVER }}
          --token=${{ secrets.RAHTI_TOKEN }}

      - name: Select Rahti project
        run: oc project ${{ secrets.RAHTI_NAMESPACE }}

      - name: Deploy frontend
        run: >
          oc set image deployment/frontend
          frontend=docker.io/${{ vars.DOCKERHUB_USERNAME }}/cloud-assignment-w4-frontend:${{ env.VERSION }}

      - name: Wait for rollout
        run: oc rollout status deployment/frontend --timeout=180s
