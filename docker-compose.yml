services:
  mysql:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cloudapp
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword

    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      - "3306:3306"

  backend:
    build:
      context: ./backend

    environment:
      PORT: 3000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cloudapp
      DB_USER: appuser
      DB_PASSWORD: apppassword

    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend

    environment:
      PORT: 8080
      BACKEND_URL: http://backend:3000

    depends_on:
      - backend

    ports:
      - "8080:8080"

volumes:
  mysql-data: